name: Move the ASCII runner

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ascii-profile-game
  cancel-in-progress: false

jobs:
  move:
    if: startsWith(github.event.issue.title, 'ascii-game:')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest game state
        run: git pull --rebase origin "${{ github.event.repository.default_branch }}"

      - name: Apply move and render board
        env:
          GAME_COMMAND: ${{ github.event.issue.title }}
        run: python3 scripts/ascii_game.py "$GAME_COMMAND"

      - name: Save the new board
        run: |
          git config user.name "signal-runner[bot]"
          git config user.email "signal-runner[bot]@users.noreply.github.com"
          git add .game-state.json assets/game.svg
          if ! git diff --cached --quiet; then
            git commit -m "game: $GAME_COMMAND by @${{ github.event.issue.user.login }}"
            git push
          fi
        env:
          GAME_COMMAND: ${{ github.event.issue.title }}

      - name: Report move and close request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const state = JSON.parse(fs.readFileSync('.game-state.json', 'utf8'));
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `🎮 ${state.status} [See the board](https://github.com/${context.repo.owner}/${context.repo.repo}#play-signal-runner)`
            });
            await github.rest.issues.update({
              ...context.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
