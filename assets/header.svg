<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Jaskirat Singh</title>
  <desc id="desc">Hardware, perception, and developer tools. Vancouver, Canada.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#42f5c8"/>
      <stop offset=".55" stop-color="#6b8cff"/>
      <stop offset="1" stop-color="#b36bff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#ffffff" stroke-opacity=".025"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="900" height="250" rx="14" fill="#090b0f"/>
  <rect width="900" height="250" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="248" rx="13" fill="none" stroke="#242932"/>
  <rect x="36" y="36" width="5" height="178" rx="2.5" fill="url(#edge)"/>

  <text x="64" y="54" fill="#697386" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2">JASKIRAT.XYZ</text>
  <circle cx="749" cy="50" r="4" fill="#42f5c8">
    <animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="765" y="54" fill="#8b95a7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">BUILDING HUMONOS</text>

  <text x="62" y="133" fill="#f5f7fa" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="-2">JASKIRAT SINGH</text>
  <rect x="62" y="151" width="774" height="2" fill="url(#edge)"/>
  <rect x="62" y="149" width="240" height="6" fill="#42f5c8" opacity=".13" filter="url(#soft)">
    <animate attributeName="x" values="62;596;62" dur="7s" repeatCount="indefinite"/>
  </rect>

  <text x="64" y="189" fill="#a8b0bf" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="1.4">HARDWARE / PERCEPTION / DEVELOPER TOOLS</text>
  <text x="836" y="189" text-anchor="end" fill="#697386" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">VANCOUVER, BC</text>
  <text x="64" y="218" fill="#4f5868" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">SWIFT · PYTHON · CUDA · METAL</text>
</svg>
