<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Jaskirat Singh — builder of hardware and intelligent systems</title>
  <desc id="desc">An animated terminal with a rotating ASCII cube, system messages, and Jaskirat's name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="0.55" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#071713"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4df7c8"/>
      <stop offset="0.55" stop-color="#78a9ff"/>
      <stop offset="1" stop-color="#cb7cff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#fff" stroke-opacity=".025"/>
    </pattern>
    <clipPath id="type-name"><rect x="56" y="86" width="0" height="48"><animate attributeName="width" values="0;0;505;505" keyTimes="0;.08;.52;1" dur="5s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="17" fill="none" stroke="url(#line)" stroke-opacity=".75"/>
  <rect width="900" height="360" rx="18" fill="url(#scan)"/>

  <circle cx="28" cy="25" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="25" r="6" fill="#febc2e"/>
  <circle cx="68" cy="25" r="6" fill="#28c840"/>
  <text x="450" y="30" text-anchor="middle" fill="#667085" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">jaskirat@physical-world: ~</text>
  <path d="M18 48H882" stroke="#ffffff" stroke-opacity=".09"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="36" y="76" fill="#4df7c8" font-size="15">$ whoami <tspan fill="#8a94a7">--verbose</tspan></text>
    <text x="54" y="121" fill="#78a9ff" opacity=".16" font-size="37" font-weight="700" letter-spacing="2">JASKIRAT SINGH</text>
    <g clip-path="url(#type-name)">
      <text x="54" y="121" fill="url(#line)" font-size="37" font-weight="700" letter-spacing="2" filter="url(#glow)">JASKIRAT SINGH</text>
    </g>
    <rect x="56" y="91" width="3" height="38" fill="#4df7c8">
      <animate attributeName="x" values="56;56;557;557" keyTimes="0;.08;.52;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1;0;1" dur=".8s" repeatCount="indefinite"/>
    </rect>

    <text x="38" y="163" fill="#79849a" font-size="14">BUILD TARGET</text>
    <text x="176" y="163" fill="#e5e7eb" font-size="14">machines that sense, understand &amp; respond</text>
    <text x="38" y="190" fill="#79849a" font-size="14">COORDINATES</text>
    <text x="176" y="190" fill="#e5e7eb" font-size="14">Vancouver, BC  /  49.2827° N</text>
    <text x="38" y="217" fill="#79849a" font-size="14">CURRENTLY</text>
    <text x="176" y="217" fill="#e5e7eb" font-size="14">building Humonos</text>

    <g transform="translate(635 78)" fill="none" stroke="#72e6ca" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <g>
        <path d="M18 36L82 10l66 29-64 28zM18 36v76l66 32V67m64-28v76l-64 29M18 112l64-29 66 32M82 10l2 57"/>
        <path d="M18 36l66 31 64-28M84 67v77" stroke-opacity=".5"/>
        <animateTransform attributeName="transform" type="skewY" values="0;-6;0;6;0" dur="6s" repeatCount="indefinite"/>
      </g>
      <circle cx="84" cy="67" r="4" fill="#cb7cff" stroke="none"><animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/></circle>
      <path d="M-8 160H172" stroke="#78a9ff" stroke-dasharray="2 7" opacity=".45"><animate attributeName="stroke-dashoffset" values="0;-36" dur="2s" repeatCount="indefinite"/></path>
      <text x="82" y="184" text-anchor="middle" fill="#79849a" stroke="none" font-size="11">PHYSICAL ↔ DIGITAL</text>
    </g>

    <text x="38" y="266" fill="#4df7c8" font-size="14">$ boot curiosity.engine</text>
    <g font-size="13">
      <text x="38" y="293" fill="#52d273">[ OK ]</text><text x="93" y="293" fill="#99a3b6">wearable sensing online</text>
      <text x="306" y="293" fill="#52d273">[ OK ]</text><text x="361" y="293" fill="#99a3b6">spatial stack online</text>
      <text x="558" y="293" fill="#52d273">[ OK ]</text><text x="613" y="293" fill="#99a3b6">weird ideas enabled</text>
    </g>
    <text x="38" y="329" fill="#657086" font-size="12">jaskirat.xyz</text>
    <text x="862" y="329" text-anchor="end" fill="#657086" font-size="12">BUILD // TEST // SHIP // REPEAT</text>
  </g>

  <rect x="0" y="48" width="900" height="2" fill="#4df7c8" opacity=".07">
    <animate attributeName="y" values="48;345;48" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".02;.15;.02" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
